services:
  api:
    container_name: aivacol_api
    build:
      context: .
      target: development
    volumes:
      - .:/usr/src/app
      - api_node_modules:/usr/src/app/node_modules
    ports:
      - ${PORT:-4000}:${PORT:-4000}
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  sqlserver:
    container_name: aivacol_sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    networks:
      - backend
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - ${DB_PORT:-1433}:1433
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    container_name: aivacol_redis
    image: redis:7-alpine
    networks:
      - backend
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    container_name: aivacol_rabbitmq
    image: rabbitmq:3-management-alpine
    networks:
      - backend
    ports:
      - ${RABBITMQ_PORT:-5672}:5672
      - ${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongodb:
    container_name: aivacol_mongodb
    image: mongo:7
    networks:
      - backend
    ports:
      - ${MONGODB_PORT:-27017}:27017
    volumes:
      - mongodb_data:/data/db
    # Logs separados: docker compose -f docker-compose.yml up --build api
    # (sobe o Mongo, mas só anexa o terminal na API)
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  backend:

volumes:
  api_node_modules:
  sqlserver_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:
